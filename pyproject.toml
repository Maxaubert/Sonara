[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sonara"
version = "0.9.0"
description = "Eyes-free text-to-speech layer for Claude Code (Windows)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Nima Hakimi", email = "hakimi.nima1@gmail.com" }]
maintainers = [{ name = "Max Aubert" }]
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/Maxaubert/Sonara"
Repository = "https://github.com/Maxaubert/Sonara"
Issues = "https://github.com/Maxaubert/Sonara/issues"

[project.scripts]
sonara = "sonara.cli:main"

[project.optional-dependencies]
# numpy: tests/test_kokoro.py builds fake Kokoro audio arrays.
dev = ["pytest>=7", "ruff>=0.16,<0.17", "numpy"]
# Headless settings-page tests (tests/e2e); also run `playwright install chromium`.
e2e = ["playwright"]
# Windows TTS runtime. OneCore speech is reached via PyWinRT; without these the
# daemon cannot synthesize and Windows users get silent no-speech (#7).
windows = [
    "winrt-runtime; sys_platform == 'win32'",
    "winrt-Windows.Media.SpeechSynthesis; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
    "winrt-Windows.Media.Control; sys_platform == 'win32'",
    "pycaw; sys_platform == 'win32'",
]
# Kokoro-82M neural voices (optional, cross-platform). One ~310 MB model + a 6 MB
# voices file (auto-downloaded on first use) provide all 28 voices. Imported lazily
# only when a Kokoro voice is selected, so base Sonara runs without these.
kokoro = [
    "kokoro-onnx>=0.3.0",
    "onnxruntime",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonara = ["platform/windows/earcons/*.wav", "settings.html", "requirements-kokoro.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_windows: drives real OneCore/winsound; skipped unless selected with -m live_windows",
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# pyupgrade (UP) is left out: ~270 mechanical rewrites (format strings,
# quoted annotations) with no bug signal, too much churn next to the
# daemon split. Revisit once daemon.py is broken up.
select = ["E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# Imports the `server` fixture from test_webui by name so pytest can inject it;
# the test parameters then shadow the import by design.
"tests/test_webui_restart_respawn.py" = ["F811"]
