# Dev tooling only: Sonara ships as the Rust runtime (crates/) and the plugin
# (this repo); nothing here is a Python package. The release version lives in
# Cargo.toml [workspace.package] (python packaging/bump_version.py <version>).
# The SDK clients/python has its own pyproject.toml.
#
# Install: python -m pip install --group dev   (pip >= 25.1)
# E2E:     python -m pip install --group e2e; python -m playwright install chromium

[dependency-groups]
# pyyaml: tests/repo/test_workflow_powershell.py parses the workflows.
# build, twine: packaging/build_packages.py builds and checks the Python SDK (#279).
dev = ["pytest>=7", "ruff>=0.16,<0.17", "pyyaml", "build", "twine"]
# Headless settings-page tests (tests/e2e) against a built sonarad.
e2e = ["pytest>=7", "playwright"]

[tool.pytest.ini_options]
# The repo checks and the settings-page e2e; conformance/ and
# clients/python/tests are run on their own.
testpaths = ["tests"]

[tool.ruff]
# clients/python and the conformance suite support Python 3.9.
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F", "B"]
