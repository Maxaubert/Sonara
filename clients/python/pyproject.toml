[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sonara-client"
version = "0.18.0"
description = "Client for the Sonara text-to-speech runtime (protocol v1). Standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# setuptools ships LICENSE beside this file (a copy of the root one) in
# the sdist and the wheel by default.
maintainers = [{ name = "Max Aubert" }]
# Zero runtime dependencies (spec R6): bundlers ship nothing else's licence.
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/Maxaubert/Sonara"
Documentation = "https://github.com/Maxaubert/Sonara/blob/main/docs/bundling.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
