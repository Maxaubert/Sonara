# CI gate on every PR and every push to main: the Python repo checks
# (ruff, tests/repo, the release version dry run), the Rust workspace with
# protocol conformance, the SDKs, and cargo-deny. The e2e settings-page tests
# (tests/e2e) skip here (no playwright installed); they are the local PR gate
# for UI changes.
# release.yml runs only after this workflow succeeded on a push to main (#250).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer PR push cancels the older run. Each push to main has its own
# group (its commit), so none is cancelled or left pending behind a newer
# one: each successful one is released.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # pyproject.toml holds dependency groups only (#248); --group needs pip 25.1.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev
      - name: Lint
        run: ruff check tests conformance clients/python packaging
      # The step release.yml reads the version with, as a dry run: Cargo.toml
      # [workspace.package] and every other version file agree.
      - name: Release version
        run: python packaging/bump_version.py --check
      - name: Repo checks and e2e (skipped without playwright)
        run: python -m pytest -q

  rust:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Protocol v1 conformance: black-box tests against the built sonarad.exe
      # (fake engine, silent output; no audio device or voices needed).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: cargo build -p sonarad -p sonara-hook -p sonara-cli
      # Also the Claude Code plugin (#202): bin/sonara-hook-launch and the
      # PowerShell bootstrap in Git Bash against a local release server,
      # sonara.exe, and a release zip installed by the first hook.
      - name: Conformance (core, channels, agent, system, persistence, plugin)
        # A hook's wall-clock bound, loosened for a busy runner where Git
        # Bash alone can take a second (#249); the launcher tests also check
        # the order, which no timing breaks.
        env:
          SONARA_TEST_HOOK_QUICK: "5"
          # The idle time of the countdown check (#247), likewise.
          SONARA_TEST_IDLE_EXIT: "1"
        run: python -m pytest conformance -q
      # THIRD_PARTY_NOTICES.md is generated from `cargo metadata`; a
      # dependency change must regenerate it (spec R6).
      - name: Notices up to date
        run: python packaging/notices/gen_notices.py --check

  # The SDKs and the npm runtime package against a real sonarad.exe (fake
  # engine), on the oldest Node and Python they support.
  clients:
    runs-on: windows-latest
    timeout-minutes: 40
    # bash -e: a failing command fails the step (pwsh only checks the last one).
    defaults:
      run:
        shell: bash
    env:
      SONARAD: ${{ github.workspace }}\target\release\sonarad.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "18"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: cargo build -p sonarad --release
      # Microsoft's official ONNX Runtime CPU build (fetched by URL, pinned
      # SHA-256) and the VC++ runtime DLLs it imports, next to sonarad.exe,
      # so the npm runtime package below is built as it ships.
      - name: Stage onnxruntime.dll and the VC++ runtime
        run: python packaging/runtime_dlls.py stage target/release
      - name: "@sonara/client: typecheck, build, test"
        working-directory: clients/ts
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
      # The player builds only on the core API; its React tests run in jsdom.
      - name: "@sonara/player: typecheck, build, test"
        working-directory: clients/player
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
      - name: "Player demo: build"
        working-directory: examples/player-demo
        run: |
          npm ci
          npm run build
      - name: "@sonara/runtime-win32-x64: build, test"
        working-directory: packaging/npm-runtime
        run: |
          npm run build
          npm test
      - name: Example Node host via the packed packages
        run: node packaging/smoke/run-node.mjs
      - name: "sonara-client: tests"
        run: |
          python -m pip install pytest ./clients/python
          python -m pytest clients/python/tests -q
      - name: Example Python host via the installed package
        env:
          SONARA_RUNTIME: ${{ github.workspace }}\target\release\sonarad.exe
        run: python packaging/smoke/python_host.py

  # cargo-deny-action is a Docker action, which GitHub runs only on Linux
  # runners. deny.toml pins the graph to the Windows target, so Windows-only
  # dependencies are still checked from here.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans
