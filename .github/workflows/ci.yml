# CI gate: lint + full unit suite on every PR and every push to main.
# The e2e settings-page tests skip here (no playwright installed); they are the
# local PR gate for UI changes. Live OneCore checks (-m live_windows) never run.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,windows]"
      - name: Lint
        if: matrix.python == '3.12'
        run: ruff check src tests
      - name: Unit tests
        run: python -m pytest -q
      # The daemon's lock-discipline asserts (daemon/core.py) are off in
      # production; one run with them on catches a caller that forgot the lock.
      - name: Unit tests with lock checks
        if: matrix.python == '3.12'
        env:
          SONARA_DEBUG_LOCKS: "1"
        run: python -m pytest -q

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # cargo-deny-action is a Docker action, which GitHub runs only on Linux
  # runners. deny.toml pins the graph to the Windows target, so Windows-only
  # dependencies are still checked from here.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans
