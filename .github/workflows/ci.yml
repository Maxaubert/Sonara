# CI gate: lint + full unit suite on every PR and every push to main.
# The e2e settings-page tests skip here (no playwright installed); they are the
# local PR gate for UI changes. Live OneCore checks (-m live_windows) never run.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,windows]"
      - name: Lint
        if: matrix.python == '3.12'
        run: ruff check src tests conformance clients/python packaging
      - name: Unit tests
        run: python -m pytest -q
      # The daemon's lock-discipline asserts (daemon/core.py) are off in
      # production; one run with them on catches a caller that forgot the lock.
      - name: Unit tests with lock checks
        if: matrix.python == '3.12'
        env:
          SONARA_DEBUG_LOCKS: "1"
        run: python -m pytest -q

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Protocol v1 conformance: black-box tests against the built sonarad.exe
      # (fake engine, silent output; no audio device or voices needed).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: cargo build -p sonarad -p sonara-hook
      - name: Conformance (core, channels, agent)
        run: python -m pytest conformance -q
      # THIRD_PARTY_NOTICES.md is generated from `cargo metadata`; a
      # dependency change must regenerate it (spec R6).
      - name: Notices up to date
        run: python packaging/notices/gen_notices.py --check

  # The SDKs and the npm runtime package against a real sonarad.exe (fake
  # engine), on the oldest Node and Python they support.
  clients:
    runs-on: windows-latest
    # bash -e: a failing command fails the step (pwsh only checks the last one).
    defaults:
      run:
        shell: bash
    env:
      SONARAD: ${{ github.workspace }}\target\release\sonarad.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: cargo build -p sonarad --release
      - name: "@sonara/client: typecheck, build, test"
        working-directory: clients/ts
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
      - name: "@sonara/runtime-win32-x64: build, test"
        working-directory: packaging/npm-runtime
        run: |
          npm run build
          npm test
      - name: Example Node host via the packed packages
        run: node packaging/smoke/run-node.mjs
      - name: "sonara-client: tests"
        run: |
          python -m pip install pytest ./clients/python
          python -m pytest clients/python/tests -q
      - name: Example Python host via the installed package
        env:
          SONARA_RUNTIME: ${{ github.workspace }}\target\release\sonarad.exe
        run: python packaging/smoke/python_host.py

  # cargo-deny-action is a Docker action, which GitHub runs only on Linux
  # runners. deny.toml pins the graph to the Windows target, so Windows-only
  # dependencies are still checked from here.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans
