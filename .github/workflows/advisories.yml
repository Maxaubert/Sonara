# RustSec advisory check (cargo deny check advisories, the [advisories]
# section of deny.toml): weekly, by hand, and on a PR or push that changes
# Cargo.lock or deny.toml. Kept out of ci.yml on purpose: a new advisory
# appears without any change here, and it must not turn every unrelated PR
# red. Not a required check; the job is not named like one of ci.yml's
# (check, rust, conformance, clients, deny), as branch protection matches
# checks by job name.
name: advisories

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [Cargo.lock, deny.toml]
  push:
    branches: [main]
    paths: [Cargo.lock, deny.toml]

permissions:
  contents: read

jobs:
  # cargo-deny-action is a Docker action, which GitHub runs only on Linux
  # runners; deny.toml pins the graph to the Windows and macOS targets.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories
