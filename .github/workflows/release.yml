# Auto-release once CI passed on a push to main (#250).
# - Runs only after ci.yml succeeded for that push (workflow_run), and
#   builds and tags exactly the commit CI checked (head_sha), so a red main
#   never ships. workflow_dispatch releases the chosen ref by hand.
# - Reads the version from Cargo.toml [workspace.package] (#248) with
#   `python packaging/bump_version.py --check`, which refuses to run if any
#   version file (plugin manifests, bin/runtime-version, the SDKs) disagrees;
#   ci.yml runs the same check on every PR as its dry run.
# - REFUSES to run if release v<version> already exists: bump the version in the PR.
# - Publishes v<version> with GitHub-generated notes and two assets:
#   sonara-runtime-win-x64-<version>.zip (sonarad.exe, sonara-hook.exe and
#   sonara.exe release builds with the CRT linked statically, onnxruntime.dll
#   with its licence files, the VC++ runtime DLLs it imports, LICENSE,
#   LICENSING.md, THIRD_PARTY_NOTICES.md) and SHA256SUMS.
#   The Claude Code plugin ships from the repo itself (the marketplace in
#   .claude-plugin/), and on first use its bin/sonara-hook-launch downloads
#   the zip of the release named in bin/runtime-version and checks it against
#   SHA256SUMS (#202). So the release must exist before users install or
#   update the plugin: merge -> CI -> this workflow publishes v<version> ->
#   users install or update. A plugin update whose release is missing stays
#   silent (each hook retries the download every 5 minutes) until it is
#   published. Unsigned until SignPath enrolment.
# - Publishes the SDKs (#279) by trusted publishing (OIDC, no tokens):
#   sonara-client to PyPI, @sonara/client and @sonara/runtime-win32-x64 to
#   npm (@sonara/player is private). Off until the repository variables
#   PUBLISH_PYPI / PUBLISH_NPM are 'true' (one-time setup: docs/bundling.md),
#   so a release never fails on a registry that is not set up yet. The
#   packages job builds them with packaging/build_packages.py (what ci.yml
#   checks on every PR); each publish job skips a version the registry has.
#   workflow_dispatch with packages_only publishes the packages of the
#   existing release v<version> (the chosen ref's Cargo.toml) without a new
#   release, e.g. right after configuring a registry (npm wants the first
#   trusted publish within 2 days).
# A push that changes only docs or repo tooling (*.md, docs/, .github/) since
# the last release tag is not released (the "Changes" step; workflow_run has
# no paths filter), so a Dependabot actions update needs no version bump.
# - GitHub picks the Latest release by version, so a run that finishes after
#   a newer one never takes the Latest mark.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      packages_only:
        description: "Only publish the SDK packages of the existing release v<version> (no new release)"
        type: boolean
        default: false

permissions:
  contents: write

# One group per commit: a newer push never cancels an older one's pending
# release. Two releases of one version fail at the tag, never overwrite.
concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  # The commit CI checked; github.sha is main's newest commit under
  # workflow_run, which may be a later one.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.packages_only) ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      released: ${{ steps.changes.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          # Full history and tags: the changes are counted since the last
          # release tag, so a multi-commit push is judged as a whole.
          fetch-depth: 0
      - name: Changes
        id: changes
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { "release=true" >> $env:GITHUB_OUTPUT; exit 0 }
          $base = git describe --tags --abbrev=0 --match 'v*' HEAD 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $base) { $base = "HEAD~1" }
          $files = @(git diff --name-only $base HEAD)
          if ($LASTEXITCODE -ne 0) { Write-Error "cannot list the changed files"; exit 1 }
          $code = @($files | Where-Object { $_ -notmatch '\.md$' -and $_ -notmatch '^docs/' -and $_ -notmatch '^\.github/' })
          if ($files.Count -gt 0 -and $code.Count -eq 0) {
            Write-Output "Only docs or tooling changed since ${base}: no release."
            "release=false" >> $env:GITHUB_OUTPUT
          } else {
            "release=true" >> $env:GITHUB_OUTPUT
          }
          exit 0
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.release == 'true'
        with:
          python-version: "3.12"

      - name: Read version
        if: steps.changes.outputs.release == 'true'
        id: ver
        shell: pwsh
        run: |
          # Cargo.toml [workspace.package]; exits 1 naming any version file
          # that disagrees (fix: python packaging/bump_version.py <version>).
          $v = python packaging/bump_version.py --check
          if ($LASTEXITCODE -ne 0 -or -not $v) { Write-Error "cannot read the release version from Cargo.toml, or a version file disagrees (see above)"; exit 1 }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { Write-Error "release version '$v' is not major.minor.patch"; exit 1 }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Refuse to overwrite an existing release
        if: steps.changes.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Release $tag already exists. Bump the version with python packaging/bump_version.py <version> (patch for a fix, minor for a feature) and push again."
            exit 1
          }
          # gh exiting 1 (release absent) is the pass case, but the pwsh step
          # wrapper propagates a lingering $LASTEXITCODE as the step result.
          exit 0

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.release == 'true'
      - name: Build the runtime zip
        if: steps.changes.outputs.release == 'true'
        id: zip
        shell: pwsh
        run: |
          cargo build -p sonarad -p sonara-hook -p sonara-cli --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # onnxruntime.dll (official CPU build, pinned SHA-256) and the VC++
          # runtime DLLs it imports, next to sonarad.exe.
          python packaging/runtime_dlls.py stage target/release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python packaging/notices/gen_notices.py --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $zip = python packaging/release_zip.py --out dist
          if ($LASTEXITCODE -ne 0 -or -not $zip) { Write-Error "release_zip.py failed"; exit 1 }
          $expected = "sonara-runtime-win-x64-${{ steps.ver.outputs.version }}.zip"
          if ((Split-Path $zip -Leaf) -ne $expected) { Write-Error "zip is $zip, expected $expected (Cargo.toml version drift)"; exit 1 }
          $runtimeVersion = (Get-Content bin/runtime-version -Raw).Trim()
          if ($runtimeVersion -ne "${{ steps.ver.outputs.version }}") { Write-Error "bin/runtime-version is ${runtimeVersion}: the plugin would download another release"; exit 1 }
          $sums = Join-Path (Split-Path $zip -Parent) "SHA256SUMS"
          if (-not (Test-Path $sums)) { Write-Error "release_zip.py wrote no SHA256SUMS"; exit 1 }
          "path=$zip" >> $env:GITHUB_OUTPUT
          "sums=$sums" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: steps.changes.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release create $tag "${{ steps.zip.outputs.path }}" "${{ steps.zip.outputs.sums }}" --title $tag --generate-notes --target $env:RELEASE_SHA

  # The SDK packages (#279), built from the release commit by
  # packaging/build_packages.py, the script ci.yml's clients job checks on
  # every PR: the npm tarballs packed as tests/embed packs them (the runtime
  # package with sonarad.exe and the files runtime_dlls.py stages next to
  # it), the wheel and the sdist. Skipped while neither PUBLISH_PYPI nor
  # PUBLISH_NPM is 'true', and after a failed or skipped release.
  packages:
    needs: release
    if: >-
      !cancelled() &&
      (vars.PUBLISH_PYPI == 'true' || vars.PUBLISH_NPM == 'true') &&
      (needs.release.outputs.released == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.packages_only))
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    # bash -e: a failing command fails the step.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Version and release commit
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python packaging/bump_version.py --check)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # By hand: build the commit release v<version> was cut from, never a later one.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release view "v$v" > /dev/null || { echo "::error::release v$v does not exist; publish it first"; exit 1; }
            git fetch --depth 1 origin "refs/tags/v$v:refs/tags/v$v"
            git checkout --detach "v$v"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build and check the packages
        run: |
          cargo build -p sonarad --release
          python packaging/runtime_dlls.py stage target/release
          python packaging/notices/gen_notices.py --check
          (cd clients/ts && npm ci)
          python -m pip install build twine
          python packaging/build_packages.py --out dist/packages
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/packages/
          if-no-files-found: error

  # npm trusted publishing (OIDC): no token. The trusted publisher of each
  # package names this file (release.yml) and the environment npm. Needs
  # npm 11.5.1 or later; provenance is attached by npm itself.
  publish-npm:
    needs: packages
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm 11.5.1 or later
        run: |
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            npm install -g npm@11
          fi
          npm --version
      - name: Publish @sonara/client and @sonara/runtime-win32-x64
        run: |
          # The client first: the runtime package is useless without it.
          for t in packages/npm/sonara-client-*.tgz packages/npm/sonara-runtime-win32-x64-*.tgz; do
            [ -f "$t" ] || { echo "::error::$t missing from the packages artifact"; exit 1; }
            name=$(tar -xOzf "$t" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
            ver=$(tar -xOzf "$t" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
            # The packument: 404 while the package does not exist yet.
            code=$(curl -s -o packument.json -w '%{http_code}' "https://registry.npmjs.org/${name/\//%2F}")
            if [ "$code" = 200 ] && node -e 'process.exit(JSON.parse(require("fs").readFileSync("packument.json", "utf8")).versions?.[process.argv[1]] ? 0 : 1)' "$ver"; then
              echo "$name@$ver is on npm already: skipped"
              continue
            fi
            if [ "$code" != 200 ] && [ "$code" != 404 ]; then echo "::error::npm registry answered $code for $name"; exit 1; fi
            npm publish "$t" --access public
          done

  # PyPI trusted publishing (OIDC): no token. The trusted publisher names
  # this file (release.yml) and the environment pypi. pypa's action runs on
  # Linux only; the dists are pure Python, built on Windows above.
  publish-pypi:
    needs: packages
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/sonara-client
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - name: Skip a version already on PyPI
        id: pypi
        run: |
          ver="${{ needs.packages.outputs.version }}"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/sonara-client/$ver/json")
          case "$code" in
            200) echo "sonara-client $ver is on PyPI already: skipped"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::PyPI answered $code for sonara-client $ver"; exit 1 ;;
          esac
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.pypi.outputs.publish == 'true'
        with:
          packages-dir: packages/python/
          # A rerun after a partly finished upload passes.
          skip-existing: true
