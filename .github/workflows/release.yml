# Auto-release once CI passed on a push to main (#250).
# - Runs only after ci.yml succeeded for that push (workflow_run), and
#   builds and tags exactly the commit CI checked (head_sha), so a red main
#   never ships. workflow_dispatch releases the chosen ref by hand.
# - Reads the version from pyproject.toml and refuses to run if
#   .claude-plugin/plugin.json or marketplace.json disagree.
# - REFUSES to run if release v<version> already exists: bump the version in the PR.
# - Publishes v<version> with GitHub-generated notes and two assets:
#   sonara-runtime-win-x64-<version>.zip (sonarad.exe, sonara-hook.exe and
#   sonara.exe release builds with the CRT linked statically, onnxruntime.dll
#   with its licence files, the VC++ runtime DLLs it imports, LICENSE,
#   LICENSING.md, THIRD_PARTY_NOTICES.md) and SHA256SUMS.
#   The Claude Code plugin ships from the repo itself (the marketplace in
#   .claude-plugin/), and on first use its bin/sonara-hook-launch downloads
#   the zip of the release named in bin/runtime-version and checks it against
#   SHA256SUMS (#202). So the release must exist before users install or
#   update the plugin: merge -> CI -> this workflow publishes v<version> ->
#   users install or update. A plugin update whose release is missing stays
#   silent (each hook retries the download every 5 minutes) until it is
#   published. Unsigned until SignPath enrolment.
# - Nothing goes to npm or PyPI: publish-packages runs only once the
#   NPM_TOKEN / PYPI_TOKEN secrets exist (manual steps: docs/bundling.md).
# A push that changes only docs (*.md, docs/, .github/ISSUE_TEMPLATE/) is
# not released (the "Changes" step; workflow_run has no paths filter).
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  # The commit CI checked; github.sha is main's newest commit under
  # workflow_run, which may be a later one.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      released: ${{ steps.changes.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 2
      - name: Changes
        id: changes
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { "release=true" >> $env:GITHUB_OUTPUT; exit 0 }
          $files = @(git diff --name-only HEAD~1 HEAD)
          if ($LASTEXITCODE -ne 0) { Write-Error "cannot list the changed files"; exit 1 }
          $code = @($files | Where-Object { $_ -notmatch '\.md$' -and $_ -notmatch '^docs/' -and $_ -notmatch '^\.github/ISSUE_TEMPLATE/' })
          if ($files.Count -gt 0 -and $code.Count -eq 0) {
            Write-Output "Docs-only change: no release."
            "release=false" >> $env:GITHUB_OUTPUT
          } else {
            "release=true" >> $env:GITHUB_OUTPUT
          }
          exit 0
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.release == 'true'
        with:
          python-version: "3.12"

      - name: Read version
        if: steps.changes.outputs.release == 'true'
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or -not $v) { Write-Error "cannot read the version from pyproject.toml"; exit 1 }
          $plugin = (Get-Content .claude-plugin/plugin.json -Raw | ConvertFrom-Json).version
          $market = (Get-Content .claude-plugin/marketplace.json -Raw | ConvertFrom-Json).plugins[0].version
          if ($plugin -ne $v -or $market -ne $v) {
            Write-Error "Version mismatch: pyproject.toml $v, plugin.json $plugin, marketplace.json $market. Keep all three equal."
            exit 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Refuse to overwrite an existing release
        if: steps.changes.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Release $tag already exists. Bump the version in pyproject.toml, plugin.json and marketplace.json (patch for a fix, minor for a feature) and push again."
            exit 1
          }
          # gh exiting 1 (release absent) is the pass case, but the pwsh step
          # wrapper propagates a lingering $LASTEXITCODE as the step result.
          exit 0

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.release == 'true'
      - name: Build the runtime zip
        if: steps.changes.outputs.release == 'true'
        id: zip
        shell: pwsh
        run: |
          cargo build -p sonarad -p sonara-hook -p sonara-cli --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # onnxruntime.dll (official CPU build, pinned SHA-256) and the VC++
          # runtime DLLs it imports, next to sonarad.exe.
          python packaging/runtime_dlls.py stage target/release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python packaging/notices/gen_notices.py --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $zip = python packaging/release_zip.py --out dist
          if ($LASTEXITCODE -ne 0 -or -not $zip) { Write-Error "release_zip.py failed"; exit 1 }
          $expected = "sonara-runtime-win-x64-${{ steps.ver.outputs.version }}.zip"
          if ((Split-Path $zip -Leaf) -ne $expected) { Write-Error "zip is $zip, expected $expected (Cargo.toml version drift)"; exit 1 }
          $runtimeVersion = (Get-Content bin/runtime-version -Raw).Trim()
          if ($runtimeVersion -ne "${{ steps.ver.outputs.version }}") { Write-Error "bin/runtime-version is ${runtimeVersion}: the plugin would download another release"; exit 1 }
          $sums = Join-Path (Split-Path $zip -Parent) "SHA256SUMS"
          if (-not (Test-Path $sums)) { Write-Error "release_zip.py wrote no SHA256SUMS"; exit 1 }
          "path=$zip" >> $env:GITHUB_OUTPUT
          "sums=$sums" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: steps.changes.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release create $tag "${{ steps.zip.outputs.path }}" "${{ steps.zip.outputs.sums }}" --title $tag --generate-notes --latest --target $env:RELEASE_SHA

  # Disabled until registry tokens exist: every step is skipped while the
  # secrets are empty, so the job passes without publishing. Manual
  # publishing: docs/bundling.md.
  publish-packages:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        if: env.NPM_TOKEN != '' || env.PYPI_TOKEN != ''
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: dtolnay/rust-toolchain@stable
        if: env.NPM_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.NPM_TOKEN != ''
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish @sonara/client and @sonara/runtime-win32-x64
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cargo build -p sonarad --release
          python packaging/runtime_dlls.py stage target/release
          (cd clients/ts && npm ci && npm run build && npm publish --access public)
          (cd packaging/npm-runtime && npm publish --access public)
      - uses: actions/setup-python@v7
        if: env.PYPI_TOKEN != ''
        with:
          python-version: "3.12"
      - name: Publish sonara-client
        if: env.PYPI_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install build twine
          cd clients/python
          python -m build
          python -m twine upload dist/*
