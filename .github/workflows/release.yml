# Auto-release once CI passed on a push to main (#250).
# - Runs only after ci.yml succeeded for that push (workflow_run), and
#   builds and tags exactly the commit CI checked (head_sha), so a red main
#   never ships. workflow_dispatch releases the chosen ref by hand.
# - Reads the version from Cargo.toml [workspace.package] (#248) with
#   `python packaging/bump_version.py --check`, which refuses to run if any
#   version file (plugin manifests, bin/runtime-version, the SDKs) disagrees;
#   ci.yml runs the same check on every PR as its dry run.
# - REFUSES to run if release v<version> already exists: bump the version in the PR.
# - Builds one runtime archive per platform, in parallel:
#   build-windows: sonara-runtime-win-x64-<version>.zip (sonarad.exe,
#     sonara-hook.exe and sonara.exe release builds with the CRT linked
#     statically, onnxruntime.dll with its licence files, the VC++ runtime
#     DLLs it imports, LICENSE, LICENSING.md, THIRD_PARTY_NOTICES.md).
#     Unsigned until SignPath enrolment.
#   build-macos: sonara-runtime-macos-arm64-<version>.tar.gz (sonarad,
#     sonara-hook, sonara and libonnxruntime.dylib, signed with the Developer
#     ID Application certificate, hardened runtime, and notarized by Apple;
#     packaging/sign_macos.py). It FAILS when the signing secrets are missing
#     (setup: docs/bundling.md): a macOS release is never unsigned.
#   The release job publishes v<version> with GitHub-generated notes, both
#   archives and one SHA256SUMS listing both, and only when BOTH builds
#   passed: one bin/runtime-version serves both platforms, so a release
#   without one of them would break that platform's plugin.
#   The Claude Code plugin ships from the repo itself (the marketplace in
#   .claude-plugin/), and on first use its bin/sonara-hook-launch downloads
#   the archive of the release named in bin/runtime-version and checks it
#   against SHA256SUMS (#202; on macOS also the code signature). So the
#   release must exist before users install or update the plugin: merge ->
#   CI -> this workflow publishes v<version> -> users install or update. A
#   plugin update whose release is missing stays silent (each hook retries
#   the download every 5 minutes) until it is published.
# - Publishes the SDKs (#279) by trusted publishing (OIDC, no tokens):
#   sonara-client to PyPI, @sonara/client and @sonara/runtime-win32-x64 to
#   npm (@sonara/player is private). Off until the repository variables
#   PUBLISH_PYPI / PUBLISH_NPM are 'true' (one-time setup: docs/bundling.md),
#   so a release never fails on a registry that is not set up yet. The
#   packages job builds them with packaging/build_packages.py (what ci.yml
#   checks on every PR); each publish job skips a version the registry has.
#   workflow_dispatch with packages_only publishes the packages of the
#   existing release v<version> (the chosen ref's Cargo.toml) without a new
#   release, e.g. right after configuring a registry (npm wants the first
#   trusted publish within 2 days).
# A push that changes only docs or repo tooling (*.md, docs/, .github/) since
# the last release tag is not released (the "Changes" step; workflow_run has
# no paths filter), so a Dependabot actions update needs no version bump.
# - GitHub picks the Latest release by version, so a run that finishes after
#   a newer one never takes the Latest mark.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      packages_only:
        description: "Only publish the SDK packages of the existing release v<version> (no new release)"
        type: boolean
        default: false

permissions:
  contents: write

# One group for every release run (#52), never cancelled in progress: runs go
# one after another, so a docs push merged while a release builds sees its
# tag in "Changes" and skips, instead of building the same version and
# failing red at the tag. A newer run replaces an older one still waiting;
# it diffs against the last tag too, so it releases what that one would have
# (when its own CI passed; else the next green push does).
concurrency:
  group: release
  cancel-in-progress: false

env:
  # The commit CI checked; github.sha is main's newest commit under
  # workflow_run, which may be a later one.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Whether to release, and which version (refusing one that exists).
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.packages_only) ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      released: ${{ steps.changes.outputs.release }}
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          # Full history and tags: the changes are counted since the last
          # release tag, so a multi-commit push is judged as a whole.
          fetch-depth: 0
      - name: Changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "release=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null) || base=""
          [ -n "$base" ] || base="HEAD~1"
          files=$(git diff --name-only "$base" HEAD) || { echo "::error::cannot list the changed files"; exit 1; }
          code=$(printf '%s\n' "$files" | grep -v -E '\.md$|^docs/|^\.github/' | grep -c . || true)
          if [ -n "$files" ] && [ "$code" = 0 ]; then
            echo "Only docs or tooling changed since ${base}: no release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.release == 'true'
        with:
          python-version: "3.12"
      - name: Read version
        if: steps.changes.outputs.release == 'true'
        id: ver
        run: |
          # Cargo.toml [workspace.package]; exits 1 naming any version file
          # that disagrees (fix: python packaging/bump_version.py <version>).
          v=$(python packaging/bump_version.py --check) || { echo "::error::cannot read the release version from Cargo.toml, or a version file disagrees (see above)"; exit 1; }
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::release version '$v' is not major.minor.patch"; exit 1; fi
          runtime=$(tr -d '\r\n' < bin/runtime-version)
          if [ "$runtime" != "$v" ]; then echo "::error::bin/runtime-version is ${runtime}: the plugin would download another release"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite an existing release
        if: steps.changes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump the version with python packaging/bump_version.py <version> (patch for a fix, minor for a feature) and push again."
            exit 1
          fi

  build-windows:
    needs: prepare
    if: needs.prepare.outputs.released == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the runtime zip
        shell: pwsh
        run: |
          cargo build -p sonarad -p sonara-hook -p sonara-cli --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # onnxruntime.dll (official CPU build, pinned SHA-256) and the VC++
          # runtime DLLs it imports, next to sonarad.exe.
          python packaging/runtime_dlls.py --platform win-x64 stage target/release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python packaging/notices/gen_notices.py --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $zip = python packaging/release_zip.py --platform win-x64 --out dist
          if ($LASTEXITCODE -ne 0 -or -not $zip) { Write-Error "release_zip.py failed"; exit 1 }
          $expected = "sonara-runtime-win-x64-${{ needs.prepare.outputs.version }}.zip"
          if ((Split-Path $zip -Leaf) -ne $expected) { Write-Error "zip is $zip, expected $expected (Cargo.toml version drift)"; exit 1 }
          if (-not (Test-Path dist/SHA256SUMS)) { Write-Error "release_zip.py wrote no SHA256SUMS"; exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-win-x64
          path: |
            dist/sonara-runtime-win-x64-${{ needs.prepare.outputs.version }}.zip
            dist/SHA256SUMS
          if-no-files-found: error

  # Signed with the Developer ID Application certificate and notarized, or
  # not released at all (user decision 2026-11-11). The secrets: docs/bundling.md.
  build-macos:
    needs: prepare
    if: needs.prepare.outputs.released == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      # The oldest macOS the runtime runs on (plan decision 8).
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # First, before any build: no secrets, no macOS release (and so no release).
      - name: Signing secrets are set
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python packaging/sign_macos.py check-secrets
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          cargo build -p sonarad -p sonara-hook -p sonara-cli --release
          # libonnxruntime.dylib (official osx-arm64 build, pinned SHA-256)
          # and its licence files, next to sonarad.
          python packaging/runtime_dlls.py --platform macos-arm64 stage target/release
          python packaging/notices/gen_notices.py --check
      - name: Import the signing certificate
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Sets APPLE_SIGNING_IDENTITY and APPLE_SIGNING_KEYCHAIN for the next steps.
        run: python packaging/sign_macos.py import-cert
      - name: Sign (Developer ID, hardened runtime, timestamp)
        run: python packaging/sign_macos.py sign target/release
      - name: Notarize
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python packaging/sign_macos.py notarize target/release
      - name: Build the runtime archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          v="${{ needs.prepare.outputs.version }}"
          tgz=$(python packaging/release_zip.py --platform macos-arm64 --out dist)
          [ "$(basename "$tgz")" = "sonara-runtime-macos-arm64-$v.tar.gz" ] || { echo "::error::archive is $tgz, expected sonara-runtime-macos-arm64-$v.tar.gz (Cargo.toml version drift)"; exit 1; }
          [ -f dist/SHA256SUMS ] || { echo "::error::release_zip.py wrote no SHA256SUMS"; exit 1; }
          # What the plugin's bootstrap checks after the download: every
          # signature in the archive verifies, with the exec bits kept.
          mkdir -p "$RUNNER_TEMP/check"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/check"
          for f in sonarad sonara-hook sonara libonnxruntime.dylib; do
            p="$RUNNER_TEMP/check/sonara-runtime-macos-arm64-$v/$f"
            [ -x "$p" ] || { echo "::error::$f is not executable in the archive"; exit 1; }
            codesign --verify --strict --verbose=2 "$p"
            codesign -dv "$p" 2>&1 | grep -q "TeamIdentifier=$APPLE_TEAM_ID" || { echo "::error::$f is not signed by the team"; exit 1; }
            # The requirement the plugin's bootstrap checks (Developer ID).
            codesign --verify --strict -R='anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = "WV7BY8CUM8"' "$p" || { echo "::error::$f fails the bootstrap's Developer ID requirement"; exit 1; }
            codesign -dv "$p" 2>&1 | grep -q "flags=.*runtime" || { echo "::error::$f lacks the hardened runtime"; exit 1; }
          done
          # sonarad: Apple Events allowed (media pause), library validation on.
          ent=$(codesign -d --entitlements - --xml "$RUNNER_TEMP/check/sonara-runtime-macos-arm64-$v/sonarad" 2>/dev/null)
          echo "$ent" | grep -q "com.apple.security.automation.apple-events" || { echo "::error::sonarad lacks the apple-events entitlement"; exit 1; }
          if echo "$ent" | grep -q "disable-library-validation"; then echo "::error::sonarad was signed with the ad-hoc entitlements"; exit 1; fi
      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "$APPLE_SIGNING_KEYCHAIN" ]; then security delete-keychain "$APPLE_SIGNING_KEYCHAIN" || true; fi
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-macos-arm64
          path: |
            dist/sonara-runtime-macos-arm64-${{ needs.prepare.outputs.version }}.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  # Publishes only when both platform builds passed (the implicit success()
  # wants every job in needs): one release serves both platforms.
  release:
    needs: [prepare, build-windows, build-macos]
    if: needs.prepare.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ needs.prepare.outputs.released }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: runtime-win-x64
          path: assets/win
      - uses: actions/download-artifact@v8
        with:
          name: runtime-macos-arm64
          path: assets/mac
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.prepare.outputs.version }}"
          tag="v$v"
          win="sonara-runtime-win-x64-$v.zip"
          mac="sonara-runtime-macos-arm64-$v.tar.gz"
          mkdir dist
          for a in "assets/win/$win" "assets/mac/$mac"; do
            [ -f "$a" ] || { echo "::error::$a is missing: a release needs both platform archives"; exit 1; }
            cp "$a" dist/
          done
          # One SHA256SUMS for both, each hash checked against its asset.
          python packaging/release_zip.py --merge assets/win/SHA256SUMS assets/mac/SHA256SUMS --out dist
          for a in "$win" "$mac"; do
            grep -q "  $a\$" dist/SHA256SUMS || { echo "::error::SHA256SUMS lists no $a"; exit 1; }
          done
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$tag" "dist/$win" "dist/$mac" dist/SHA256SUMS --title "$tag" --generate-notes --target "$RELEASE_SHA"

  # The SDK packages (#279), built from the release commit by
  # packaging/build_packages.py, the script ci.yml's clients job checks on
  # every PR: the npm tarballs packed as tests/embed packs them (the runtime
  # package with sonarad.exe and the files runtime_dlls.py stages next to
  # it), the wheel and the sdist. Skipped while neither PUBLISH_PYPI nor
  # PUBLISH_NPM is 'true', and after a failed or skipped release (a failed
  # job still passes on the outputs it set, so its result is checked too).
  packages:
    needs: release
    if: >-
      !cancelled() &&
      (vars.PUBLISH_PYPI == 'true' || vars.PUBLISH_NPM == 'true') &&
      ((needs.release.result == 'success' && needs.release.outputs.released == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.packages_only))
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    # bash -e: a failing command fails the step.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Version and release commit
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python packaging/bump_version.py --check)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # By hand: build the commit release v<version> was cut from, never a later one.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release view "v$v" > /dev/null || { echo "::error::release v$v does not exist; publish it first"; exit 1; }
            git fetch --depth 1 origin "refs/tags/v$v:refs/tags/v$v"
            git checkout --detach "v$v"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build and check the packages
        run: |
          cargo build -p sonarad --release
          python packaging/runtime_dlls.py stage target/release
          python packaging/notices/gen_notices.py --check
          (cd clients/ts && npm ci)
          python -m pip install build twine
          python packaging/build_packages.py --out dist/packages
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/packages/
          if-no-files-found: error

  # npm trusted publishing (OIDC): no token. The trusted publisher of each
  # package names this file (release.yml) and the environment npm. Needs
  # npm 11.5.1 or later; provenance is attached by npm itself.
  publish-npm:
    needs: packages
    # Not the implicit success(): it also wants the release job, which a
    # packages_only run skips.
    if: "!cancelled() && needs.packages.result == 'success' && vars.PUBLISH_NPM == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm 11.5.1 or later
        run: |
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            npm install -g npm@11
          fi
          npm --version
      - name: Publish @sonara/client and @sonara/runtime-win32-x64
        run: |
          # The client first: the runtime package is useless without it.
          for t in packages/npm/sonara-client-*.tgz packages/npm/sonara-runtime-win32-x64-*.tgz; do
            [ -f "$t" ] || { echo "::error::$t missing from the packages artifact"; exit 1; }
            name=$(tar -xOzf "$t" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
            ver=$(tar -xOzf "$t" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
            # The packument: 404 while the package does not exist yet.
            code=$(curl -s -o packument.json -w '%{http_code}' "https://registry.npmjs.org/${name/\//%2F}")
            if [ "$code" = 200 ] && node -e 'process.exit(JSON.parse(require("fs").readFileSync("packument.json", "utf8")).versions?.[process.argv[1]] ? 0 : 1)' "$ver"; then
              echo "$name@$ver is on npm already: skipped"
              continue
            fi
            if [ "$code" != 200 ] && [ "$code" != 404 ]; then echo "::error::npm registry answered $code for $name"; exit 1; fi
            npm publish "$t" --access public
          done

  # PyPI trusted publishing (OIDC): no token. The trusted publisher names
  # this file (release.yml) and the environment pypi. pypa's action runs on
  # Linux only; the dists are pure Python, built on Windows above.
  publish-pypi:
    needs: packages
    # Not the implicit success(): it also wants the release job, which a
    # packages_only run skips.
    if: "!cancelled() && needs.packages.result == 'success' && vars.PUBLISH_PYPI == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/sonara-client
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - name: Skip a version already on PyPI
        id: pypi
        run: |
          ver="${{ needs.packages.outputs.version }}"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/sonara-client/$ver/json")
          case "$code" in
            200) echo "sonara-client $ver is on PyPI already: skipped"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::PyPI answered $code for sonara-client $ver"; exit 1 ;;
          esac
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: steps.pypi.outputs.publish == 'true'
        with:
          packages-dir: packages/python/
          # A rerun after a partly finished upload passes.
          skip-existing: true
