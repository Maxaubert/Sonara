[workspace]
resolver = "2"
members = ["crates/sonara-core"]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Maxaubert/Sonara"

[workspace.dependencies]
regex = "1"
fancy-regex = "0.14"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
