[workspace]
resolver = "2"
members = ["crates/misaki", "crates/sonara-core", "crates/sonara-engine", "crates/sonara-audio", "crates/sonara-reader", "crates/sonara-channels", "crates/sonara-agent", "crates/sonara-system", "crates/sonarad", "crates/sonara-hook", "crates/sonara-cli", "crates/sonara-log"]

[workspace.package]
version = "0.19.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Maxaubert/Sonara"

[workspace.dependencies]
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Media_Core", "Media_SpeechSynthesis", "Storage_Streams"] }
windows-future = "0.3"
rodio = { version = "0.21", default-features = false, features = ["playback"] }
misaki = { path = "crates/misaki" }
sha2 = "0.10"
sonara-core = { path = "crates/sonara-core" }
sonara-engine = { path = "crates/sonara-engine" }
sonara-audio = { path = "crates/sonara-audio" }
sonara-reader = { path = "crates/sonara-reader", default-features = false }
sonara-channels = { path = "crates/sonara-channels" }
sonara-agent = { path = "crates/sonara-agent", default-features = false }
sonara-system = { path = "crates/sonara-system" }
sonara-log = { path = "crates/sonara-log" }
tokio = { version = "1", default-features = false }
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
http-body-util = "0.1"
bytes = "1"
