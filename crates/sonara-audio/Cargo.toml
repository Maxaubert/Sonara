[package]
name = "sonara-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `TestOutput`, an output that records calls and lets tests drive events.
test-util = []

[dependencies]
sonara-core.workspace = true
sonara-engine.workspace = true
rodio.workspace = true

[target.'cfg(windows)'.dependencies]
# The default render endpoint's id, to follow a change of the default output (#288).
windows = { workspace = true, features = ["Win32_Media_Audio", "Win32_System_Com"] }

[dev-dependencies]
# Builds TestOutput with the crate's own tests and lints.
sonara-audio = { path = ".", features = ["test-util"] }
