[package]
name = "sonara-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sonara L5 support: the protocol v1 client (home, runtime.json, connect, send, start the runtime) shared by the hook, the CLI and sonarad"

# A leaf: no workspace dependencies and only serde_json, so the L5 adapters
# link no runtime crate (R7, sonara-core/tests/layering.rs).
[dependencies]
serde_json.workspace = true
