[package]
name = "sonara-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sonara's command line (sonara.exe): start, stop, settings, doctor and uninstall for the Claude Code plugin's runtime"

[[bin]]
name = "sonara"
path = "src/main.rs"

[dependencies]
# Protocol only, like the hook (R7): no runtime crate.
sonara-client.workspace = true
serde_json.workspace = true

# Credential Manager (uninstall removes the external engine keys) and the
# console (a key prompt without echo).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Console"] }

# The key prompt without echo (termios).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Keychain (uninstall removes the external engine keys on macOS).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
