[package]
name = "sonara-log"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sonara's troubleshooting log: rotating segments under one size budget, shared by sonarad and the hook processes"

# A leaf: no workspace dependencies and only serde_json (for `scrub`), so
# the L5 hook adapter can link it without linking any runtime crate (R7,
# sonara-core/tests/layering.rs).
[dependencies]
serde_json.workspace = true
