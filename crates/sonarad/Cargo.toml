[package]
name = "sonarad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sonara host process: serves protocol v1 (core and extensions) over loopback TCP and HTTP"

[[bin]]
name = "sonarad"
path = "src/main.rs"

[dependencies]
# `test-util` brings the fake engine and is only used with `--engine fake`
# (documented as a testing aid in docs/protocol-v1.md).
sonara-reader = { workspace = true, features = ["onecore", "test-util"] }
sonara-engine = { workspace = true, features = ["test-util"] }
sonara-audio.workspace = true
sonara-channels.workspace = true
sonara-agent = { workspace = true, features = ["summaries"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
bytes.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
sonara-audio = { workspace = true, features = ["test-util"] }
