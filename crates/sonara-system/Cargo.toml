[package]
name = "sonara-system"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sonara L4 (Windows): duck or pause other apps' audio with crash restore, global hotkeys and the keymap"

[dependencies]
# L4 builds only on the L1 facade (R7, checked by sonara-core/tests/layering.rs); the
# host maps hotkey actions to L1 to L3 controls.
sonara-reader.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future.workspace = true

[dev-dependencies]
sonara-reader = { workspace = true, features = ["test-util"] }
sonara-engine = { workspace = true, features = ["test-util"] }
sonara-audio = { workspace = true, features = ["test-util"] }
