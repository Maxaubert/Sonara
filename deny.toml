[graph]
targets = ["x86_64-pc-windows-msvc"]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016"]
confidence-threshold = 0.9

[bans]
# Spec R2/R6: no espeak or piper code, whatever the crate is called.
deny = [
    { name = "espeak-rs" }, { name = "espeak-rs-sys" }, { name = "espeak-ng" }, { name = "espeak-ng-sys" },
    { name = "espeakng" }, { name = "espeakng-sys" }, { name = "espeak-sys" },
    { name = "piper-phonemize" }, { name = "piper-phonemize-sys" },
]
